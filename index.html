<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    DİKKAT: Aşağıdaki %SITE_*% belirteçleri build sırasında
    src/data/siteConfig.js'ten OTOMATİK doldurulur (vite.config.js > seoFromConfig).
    Firma adı / domain / telefon / adres değiştirmek için BURAYI DEĞİL,
    src/data/siteConfig.js dosyasını düzenleyin.
    sitemap.xml ve robots.txt de aynı kaynaktan üretilir.
  -->

  <!-- Performans -->
  %SITE_ANALYTICS_PRECONNECT%
  <!-- LCP görseli (yalnızca ana sayfa; diğer rotalarda build sırasında silinir) -->
  %SITE_HERO_PRELOAD%
  <!-- Yazı tipi kendi sunucumuzdan; kuralları aşağıda satır içi.
       Gerekçesi ve alt küme üretimi: docs/yazi-tipi.md — okumadan değiştirmeyin.
       Preload yalnızca 400 ve 700; dördünü birden preload ETMEYİN. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/kanit-400.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/kanit-700.woff2" crossorigin />
  <style>
    @font-face{font-family:'Kanit';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/kanit-400.woff2) format('woff2')}
    @font-face{font-family:'Kanit';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/kanit-500.woff2) format('woff2')}
    @font-face{font-family:'Kanit';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/kanit-600.woff2) format('woff2')}
    @font-face{font-family:'Kanit';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/kanit-700.woff2) format('woff2')}
  </style>

  <title>%SITE_TITLE%</title>
  <meta name="description" content="%SITE_DESCRIPTION%" />
  <meta name="keywords" content="%SITE_KEYWORDS%" />
  <meta name="author" content="%SITE_NAME%" />

  <!-- Robots -->
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

  <!-- Konum -->
  <meta name="geo.region" content="%SITE_GEO_REGION%" />
  <meta name="geo.placename" content="%SITE_CITY%" />
  %SITE_OPTIONAL_META%

  <!-- Güvenlik -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Tema -->
  <meta name="theme-color" content="%SITE_THEME_COLOR%" />

  <!-- Favicon / uygulama ikonları -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/logo/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Canonical -->
  <link rel="canonical" href="%SITE_URL%/" />

  <!-- llms.txt — LLM'ler ve AI arama motorlarının okuyacağı düz metin özet.
       llms.txt'in KAYITLI bir keşif yöntemi yok: dosya kökte duruyor diye
       kimse bakmıyor. Elimizdeki iki işaret bu satır ile robots.txt'teki
       yorum satırı; ikisi de duruyor çünkü bazı tarayıcılar yalnız robots.txt
       okuyor, bazıları yalnızca sayfa <head>'ini ayrıştırıyor.
       Bu satır şablonda olduğu için 47 rotanın hepsine giriyor. Aşağıdaki
       canonical'ı rotaya göre yeniden yazan düzenli ifade (vite.config.js:785)
       rel="canonical" arıyor, buraya dokunmaz. -->
  <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt" />
  <link rel="alternate" type="text/plain" title="llms-full.txt" href="/llms-full.txt" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="tr_TR" />
  <meta property="og:site_name" content="%SITE_NAME%" />
  <meta property="og:title" content="%SITE_TITLE%" />
  <meta property="og:description" content="%SITE_DESCRIPTION%" />
  <meta property="og:url" content="%SITE_URL%/" />
  <meta property="og:image" content="%SITE_OG_IMAGE%" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="%SITE_TITLE%" />
  <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
  <meta name="twitter:image" content="%SITE_OG_IMAGE%" />

  <!-- Yapılandırılmış veri (Schema.org) -->
  <script type="application/ld+json">
%SITE_JSONLD%
  </script>

  %SITE_ANALYTICS%
</head>
<body>
  <!-- İçindeki hero ön boyaması YALNIZCA ana sayfada bulunur ve React açılınca
       createRoot tarafından temizlenir. Gerekçesi vite.config.js > heroOnizleme. -->
  <div id="root">%SITE_HERO_ONIZLEME%</div>

  <!-- JavaScript çalışmadığında görünen içerik (arama motorları ve erişilebilirlik için) -->
  <noscript>
    <style>
      .noscript-seo { display: block; padding: 2rem; font-family: system-ui, sans-serif; line-height: 1.6; max-width: 48rem; margin: 0 auto; }
      .noscript-seo h1 { font-size: 1.75rem; margin-bottom: .75rem; }
      .noscript-seo h2 { font-size: 1.25rem; margin: 1.5rem 0 .5rem; }
      .noscript-seo ul { padding-left: 1.25rem; }
      .noscript-seo a { color: #6E1B2E; }
    </style>
    <div class="noscript-seo">
      <!-- Bu blok YALNIZCA ana sayfa içindir. Diğer 38 rotada vite.config.js
           (writeBundle > noscriptGovdesi) sayfanın kendi H1'i ve giriş
           metniyle değiştirir. Başlık, ekranda görünen H1 ile aynı olmalı. -->
      <h1>%SITE_CITY%&apos;de Karot, Beton Delme &amp; Kesme Hizmetleri</h1>
      <p>%SITE_DESCRIPTION%</p>
      <h2>Hizmetlerimiz</h2>
      <ul>
        %SITE_SERVICE_LINKS%
      </ul>
      <h2>Hizmet Bölgeleri</h2>
      <p><a href="/hizmet-bolgeleri/">%SITE_CITY% genelinde tüm ilçelerde hizmet veriyoruz.</a></p>
      <h2>İletişim</h2>
      <p>Telefon: <a href="tel:%SITE_PHONE_RAW%">%SITE_PHONE%</a></p>
      <p>Adres: %SITE_ADDRESS%</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
